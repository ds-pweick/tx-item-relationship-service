name: "Validate OpenAPI definition"

on:
  workflow_dispatch: # Trigger manually
  workflow_call:
    inputs:
      ref-to-checkout:
        description: 'Ref of branch/tag from which to execute workflow'
        required: true
        type: string
  pull_request:
  push:
    branches:
      - main
    tags:
      - '**'

jobs:
  test_swagger_editor_validator_remote:
    runs-on: ubuntu-latest
    name: Swagger Editor Validator Remote

    steps:
      - name: Identify triggering event
        id: trigger-identification
        run: |
          if [[ "${{ github.event_name }}" != "workflow_call" ]]; then
            echo "ref=${{ github.ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ inputs.ref-to-checkout }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.trigger-identification.outputs.ref }}

      - name: Validate OpenAPI definition
        uses: char0n/swagger-editor-validate@v1
        with:
          definition-file: docs/src/api/irs-api.yaml
